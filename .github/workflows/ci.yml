name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Node ${{ matrix.node }} / ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest
          - macos-latest
        node:
          - 22
          - 24

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npm run check
      - run: npm run beta:smoke
      - name: Verify production dependency advisories
        run: npm audit --omit=dev --audit-level=high --registry=https://registry.npmjs.org
      - name: Build beta container
        if: matrix.os == 'ubuntu-latest' && matrix.node == 22
        run: docker build -t playcision-beta:ci .
      - name: Validate Cloudflare bundle and Workers runtime
        if: matrix.os == 'ubuntu-latest' && matrix.node == 24
        run: |
          npm run cloud:bundle
          npm run cloud:smoke
